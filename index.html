<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>測站通訊監控系統</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        :root { 
            --sidebar-width: 400px; --primary: #2c3e50; --active-blue: #3182ce; 
            --hub-color: #e53e3e; --reg-color: #38a169; --tree-line: #e2e8f0;
            --auto-color: #4299e1;
        }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: "Inter", "Microsoft JhengHei", sans-serif; background: #f7fafc; }
        .wrapper { display: flex; height: 100%; width: 100%; position: relative; overflow: hidden; }
        
        #sidebar { width: var(--sidebar-width); height: 100%; background: white; border-right: 1px solid #edf2f7; display: flex; flex-direction: column; z-index: 2000; transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-width)); }
        
        /* 標題欄位：padding-top 確保不被選單按鈕擋住 */
        .header { padding: 24px; padding-top: 70px; background: var(--primary); color: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .header h3 { margin: 0; font-size: 18px; letter-spacing: 1px; }
        
        .search-box { padding: 16px; background: white; border-bottom: 1px solid #edf2f7; position: relative; }
        #searchInput { width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 12px; outline: none; font-size: 14px; transition: all 0.2s; }
        #searchInput:focus { border-color: var(--active-blue); box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15); }
        .clear-btn { position: absolute; right: 28px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #a0aec0; font-size: 18px; display: none; }

        .toolbar { padding: 12px 16px; background: #f8fafc; border-bottom: 1px solid #edf2f7; display: flex; gap: 8px; }
        .tool-btn { flex: 1; padding: 8px; font-size: 13px; cursor: pointer; background: white; border: 1px solid #e2e8f0; border-radius: 8px; font-weight: 600; color: #4a5568; transition: all 0.2s; }
        .tool-btn:hover { background: #edf2f7; border-color: #cbd5e0; }

        .tree { flex-grow: 1; overflow-y: auto; padding: 12px 0; scroll-behavior: smooth; }
        details { margin-left: 18px; border-left: 1.5px solid var(--tree-line); position: relative; }
        details::before { content: ""; position: absolute; top: 20px; left: 0; width: 10px; border-top: 1.5px solid var(--tree-line); }
        summary { padding: 10px; padding-left: 14px; cursor: pointer; font-weight: 700; color: #2d3748; list-style: none; border-radius: 8px; display: flex; align-items: center; position: relative; transition: background 0.2s; }
        summary:hover { background: #f7fafc; }
        summary::after { content: '▹'; position: absolute; left: -11px; color: #a0aec0; background: white; width: 16px; text-align: center; font-size: 11px; }
        details[open] > summary::after { content: '▿'; }
        .count-badge { font-size: 11px; color: #718096; background: #edf2f7; padding: 2px 8px; border-radius: 20px; margin-left: 8px; }
        .main-summary { background: #f1f5f9 !important; font-size: 15px; margin-left: -10px; border-left: none !important; }

        .st-item { padding: 9px 14px; margin-left: 22px; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; border-radius: 8px; position: relative; margin-bottom: 2px; border-bottom: 1px solid #f9f9f9; }
        .st-item::before { content: ""; position: absolute; left: -22px; top: 50%; width: 22px; border-top: 1.5px solid var(--tree-line); }
        .st-item:hover { background: #ebf8ff; color: #2b6cb0; }
        .st-item.active-highlight { background: var(--active-blue) !important; color: white !important; font-weight: 700; z-index: 5; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .st-item.active-highlight::before { border-top-color: var(--active-blue); }
        .badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; color: white; background: #4299e1; margin-left: auto; flex-shrink: 0; }
        .badge.hub { background: var(--hub-color); }

        /* 地圖控制盒優化：支援收摺 */
        #map { flex-grow: 1; height: 100%; position: relative; background: #f0f2f5; }
        .map-controls {
            position: absolute; top: 20px; right: 20px; z-index: 3000;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            padding: 0; border-radius: 12px; border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); font-size: 13px; width: 250px;
            overflow: hidden;
        }
        .map-controls label { display: flex; align-items: center; cursor: pointer; gap: 10px; font-weight: 600; color: #4a5568; margin-bottom: 8px; }
        /* 控制盒標題按鈕 */
        .map-controls summary {
            padding: 12px; cursor: pointer; font-weight: 800; color: #2d3748;
            list-style: none; display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.5);
        }
        .map-controls summary::after { content: '⚙️'; font-size: 14px; }
        .map-controls[open] summary { border-bottom: 2px solid #edf2f7; }

        .map-controls .content { padding: 12px; }
        .map-controls label { display: flex; align-items: center; cursor: pointer; gap: 10px; font-weight: 600; color: #4a5568; margin-bottom: 8px; }
        .map-controls input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--active-blue); }

        @media (max-width: 768px) { 
            :root { --sidebar-width: 85%; } 
            #sidebar { position: absolute; } 
            .map-controls { top: 85px; right: 10px; width: 150px; } /* 手機版位置微調 */
        }
        /* 選單按鈕：置於最頂層 */
        .menu-toggle { position: absolute; top: 20px; left: 20px; z-index: 3001; background: white; padding: 12px 18px; border-radius: 10px; cursor: pointer; font-weight: 700; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1.5px solid #edf2f7; }
        
        .info-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
        .info-table th { text-align: left; color: #718096; width: 90px; padding: 6px 8px; border-bottom: 1px solid #edf2f7; background: #f8fafc; }
        .info-table td { padding: 6px 8px; color: #2d3748; border-bottom: 1px solid #edf2f7; word-break: break-all; }

        @media (max-width: 768px) { :root { --sidebar-width: 85%; } #sidebar { position: absolute; } .map-controls { top: 85px; right: 10px; } }

        /* 站名切換按鈕 */
        .name-toggle-btn { font-size: 10px; padding: 1px 6px; border-radius: 4px; cursor: pointer; margin-left: auto; background: #edf2f7; border: 1px solid #cbd5e0; color: #4a5568; line-height: 1.6; }
        .name-toggle-btn.active { background: var(--active-blue); color: white; border-color: var(--active-blue); }
        .name-toggle-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        /* 地圖上的永久站名標籤 */
        .leaflet-tooltip.station-name-label { background: transparent; border: none; box-shadow: none; font-size: 11px; font-weight: 700; color: #1a202c; white-space: nowrap; padding: 0 2px; }
        .leaflet-tooltip.station-name-label::before { display: none; }

        /* 側欄底部說明連結 */
        .sidebar-footer { padding: 10px 14px; border-top: 1px solid #edf2f7; background: #f8fafc; flex-shrink: 0; }
        .guide-link {
            display: flex; align-items: center; gap: 9px;
            padding: 10px 14px; border-radius: 9px;
            text-decoration: none; color: #4a5568;
            font-size: 13px; font-weight: 600;
            background: white; border: 1.5px solid #e2e8f0;
            transition: all 0.2s; cursor: pointer;
        }
        .guide-link:hover {
            background: #ebf8ff; color: #2b6cb0;
            border-color: #90cdf4;
            box-shadow: 0 2px 6px rgba(66,153,225,0.15);
        }
        .guide-link svg { width: 16px; height: 16px; flex-shrink: 0; stroke: currentColor; }
        .guide-link .gl-text { flex: 1; }
        .guide-link .gl-ext { color: #a0aec0; font-size: 11px; }
    </style>

</head>
<body>
    <div class="menu-toggle" onclick="toggleSidebar()">≡ 選單</div>
    <div class="wrapper">
        <div id="sidebar">
            <div class="header">
                <h3>測站通訊監控系統</h3>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 搜尋站名或代碼..." oninput="handleSearch()">
                <span id="clearBtn" class="clear-btn" onclick="clearSearch()">✖</span>
            </div>
            <div class="toolbar">
                <button class="tool-btn" onclick="collapseAll()">一鍵收合目錄</button>
                <button class="tool-btn" onclick="resetMap()">全台視圖</button>
                <button class="tool-btn" onclick="generateSVGExport()">📥 下載SVG</button>
            </div>
            <div class="tree" id="treeView"></div>
            <div class="tree" id="searchResults"></div>
            <div class="sidebar-footer">
                <a class="guide-link" href="OD_station_monitor_guide.html" target="_blank" rel="noopener">
                    <i data-lucide="book-open"></i>
                    <span class="gl-text">操作說明手冊</span>
                    <span class="gl-ext"><i data-lucide="external-link"></i></span>
                </a>
            </div>
        </div>

        <div id="map">
            <details class="map-controls" open>
                <summary>圖層設定</summary>
                <div class="content">
                    <label><input type="checkbox" id="layerCenter" checked onchange="drawMap()"> <span style="color:var(--reg-color);">●</span> 區域中心 <button class="name-toggle-btn" id="nameBtnCenter" onclick="event.stopPropagation();toggleName('Center')" title="顯示/隱藏站名">顯示/隱藏名字</button></label>
                    <label><input type="checkbox" id="layerHub" checked onchange="drawMap()"> <span style="color:var(--hub-color);">●</span> 中繼站 <button class="name-toggle-btn" id="nameBtnHub" onclick="event.stopPropagation();toggleName('Hub')" title="顯示/隱藏站名">顯示/隱藏名字</button></label>
                    <label><input type="checkbox" id="layerAuto" checked onchange="drawMap()"> <span style="color:var(--auto-color);">●</span> 自動站 <button class="name-toggle-btn" id="nameBtnAuto" onclick="event.stopPropagation();toggleName('Auto')" title="顯示/隱藏站名">顯示/隱藏名字</button></label>
                    <hr style="border:0; border-top:1.5px solid #edf2f7; margin:10px 0;">
                    <label><input type="checkbox" id="linkAutoHub" checked onchange="drawMap()"> <span style="color:var(--hub-color); opacity:0.6;">---</span> 自動站-中繼站</label>
                    <label><input type="checkbox" id="linkHubReg" checked onchange="drawMap()"> <span style="color:var(--reg-color); opacity:0.8;">---</span> 中繼站-區域站</label>
                    <label><input type="checkbox" id="linkAutoReg" checked onchange="drawMap()"> <span style="color:var(--active-blue); opacity:0.8;">- - -</span> 自動站-區域站</label>
                </div>
            </details>
        </div>
    </div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
        let geojsonData, treeData, mainOrder, cwaSubOrder, regionalOrder, regionalCenters, allStations;
        let map, centerLayer, hubLayer, autoLayer, lineAutoHubLayer, lineCenterLayer, currentFilter = null;
        const labelState = { Center: null, Hub: null, Auto: null }; // null=自動, true=強制顯示, false=強制隱藏
        let highlightedStation = null; // 目前被點選聚焦的區域中心/中繼站物件，null=無聚焦
        let pendingPopupStation = null; // 下一次 drawMap 後要自動開啟 popup 的站

        async function loadDataAndInit() {
            try {
                // 同時下載兩個檔案，速度更快！
                const currentTimeStamp = new Date().getTime(); 
                const [resData, resGeo] = await Promise.all([
                    fetch('stationData.json?v=' + currentTimeStamp),
                    fetch('taiwan.json') // 👈 直接讀取原始地圖檔
                ]);
                const d = await resData.json();
                const g = await resGeo.json();

                geojsonData = g; // 👈 地圖資料來自獨立的檔案
                treeData = d.treeData;
                mainOrder = d.mainOrder;
                cwaSubOrder = d.cwaSubOrder;
                regionalOrder = d.regionalOrder;
                regionalCenters = d.regionalCenters;
                allStations = d.allStations;
                initMap();
            } catch (e) { console.error("Data Load Error:", e); }
        }
        // --- 初始化地圖 ---
        function initMap() {
            map = L.map('map', { 
                zoomControl: false,
                zoomSnap: 0.1,    // 允許停在非整數的縮放層級 (例如 8.2)
                zoomDelta: 0.1,   // 每次縮放變化的幅度
                wheelPxPerZoomLevel: 120 // 調整滾輪靈敏度 (數值越大越慢/越精確)
                }).setView([23.7, 121.0], 8);

            map.on('zoomend', () => drawMap(currentFilter));

            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '© CartoDB' }).addTo(map);
            if (geojsonData.type) {
            L.geoJSON(geojsonData, {
                style: { color: '#404040', weight: 0.5, fillOpacity: 0.05, fillColor: '#f8fafc' }
            }).addTo(map);
            }

            // 🚀 關鍵新增：阻斷圖層控制盒的事件穿透，防止誤觸雙擊放大與滾輪縮放
            const mapControls = document.querySelector('.map-controls');
            if (mapControls) {
                L.DomEvent.disableClickPropagation(mapControls);
                L.DomEvent.disableScrollPropagation(mapControls);
            }

            // 🚀 關鍵新增：點擊地圖空白處時，自動解除點選聚焦，恢復正常顏色
            map.on('click', function () {
                if (highlightedStation) {
                    highlightedStation = null;
                    drawMap(currentFilter); // 重新繪製地圖，讓所有站點亮起來
                }
            });
            lineCenterLayer  = L.layerGroup().addTo(map);  // 最底：中繼站-區域站連線
            lineAutoHubLayer = L.layerGroup().addTo(map);  // 自動站-中繼站連線
            autoLayer        = L.layerGroup().addTo(map);  // 自動站
            hubLayer         = L.layerGroup().addTo(map);  // 中繼站
            centerLayer      = L.layerGroup().addTo(map);  // 最頂：區域中心
            buildSidebar();
            drawMap();
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            setTimeout(() => map.invalidateSize(), 500);
            
            // 如果是手機版，初始化後自動關閉圖層控制盒
            if (window.innerWidth < 768) {
                document.querySelector('.map-controls').open = false;
            }
        }

        function countStations(nodes) {
            let count = 0;
            nodes.forEach(node => { if (node.rid) count++; if (node.children) count += countStations(node.children); });
            return count;
        }

        function highlightListItem(rid) {
            document.querySelectorAll('.st-item').forEach(el => el.classList.remove('active-highlight'));
            const target = document.getElementById("item-" + rid);
            if (target) { target.classList.add('active-highlight'); target.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        }

        function navigateToStation(rid) {
            const st = allStations[rid];
            clearSearch();
            const mEl = document.getElementById("main-" + st.main_cat), sEl = document.getElementById("sub-" + st.main_cat + "-" + st.sub_cat), fEl = document.getElementById("folder-" + st.sub_cat + "-" + st.folder);
            if (mEl) mEl.open = true; if (sEl) sEl.open = true; if (fEl) fEl.open = true;
            highlightListItem(rid); focusPoint(st);
        }

        function handleSearch() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const treeV = document.getElementById('treeView'), resV = document.getElementById('searchResults'), btn = document.getElementById('clearBtn');
            
            if (q === "") { clearSearch(); return; }
            
            btn.style.display = "block"; 
            treeV.style.display = "none"; 
            resV.style.display = "block"; 
            resV.innerHTML = "";
            
            // 搜尋邏輯
            const matches = Object.values(allStations).filter(st => 
                st.n.toLowerCase().includes(q) || 
                st.sid.toLowerCase().includes(q) || 
                st.cwbid.toLowerCase().includes(q)
            );

            matches.forEach(st => {
                const div = document.createElement('div');
                div.className = 'st-item'; 
                div.style.marginLeft = "5px"; 
                
                // 這裡移除了反斜線，只保留雙大括號 ${ }
                div.innerHTML = `
                    <div style="display: flex; flex-direction: column; flex-grow: 1;">
                        <span style="font-weight: bold; color: #2d3748;">${st.n}</span>
                        <span style="font-size: 11px; color: #718096;">代碼: ${st.sid} / ${st.cwbid}</span>
                    </div>
                    <span class="badge ${st.is_hub ? 'hub' : ''}">${st.is_hub ? '中繼' : '自動'}</span>
                `;

                div.onclick = () => {
                    if(window.innerWidth < 768) toggleSidebar(true);
                    navigateToStation(st.rid);
                };
                resV.appendChild(div);
            });
        }

        function clearSearch() {
            document.getElementById('searchInput').value = ""; document.getElementById('clearBtn').style.display = "none";
            document.getElementById('treeView').style.display = "block"; document.getElementById('searchResults').style.display = "none";
        }

        function createRecursiveHTML(node) {
            if (node.children && node.children.length > 0) {
                const det = document.createElement('details');
                const sum = document.createElement('summary');
                sum.innerHTML = `<span><span style="${node.is_hub?'color:var(--hub-color)':''}">${node.n}</span><span class="count-badge">${countStations(node.children)}</span></span>`;
                sum.onclick = (e) => { e.stopPropagation(); focusGroup(node); };
                det.appendChild(sum);
                node.children.forEach(c => det.appendChild(createRecursiveHTML(c)));
                return det;
            } else {
                const div = document.createElement('div');
                div.className = 'st-item'; div.id = "item-" + node.rid;
                div.innerHTML = `<span>${node.n}</span><span class="badge ${node.is_hub?'hub':''}">${node.is_hub?'中繼':'自動'}</span>`;
                div.onclick = (e) => { e.stopPropagation(); highlightListItem(node.rid); focusPoint(node); };
                return div;
            }
        }
        
        function generateSVGExport() {
            const bounds = map.getBounds();
            const size = map.getSize();
            const w = size.x, h = size.y;
            const zoom = map.getZoom();
            const isFocused = !!highlightedStation;

            // 1. 讀取標籤狀態
            const effCenter = labelState.Center === null ? (zoom >= 7)  : labelState.Center;
            const effHub    = labelState.Hub    === null ? (zoom >= 10) : labelState.Hub;
            const effAuto   = labelState.Auto   === null ? false        : labelState.Auto;
            const _allowAuto = zoom > 10 || isFocused;

            // 2. 🚀 完全同步 drawMap 的圖層鎖定邏輯與狀態
            let allowLayerControl = true;
            if (currentFilter && currentFilter.length > 0) {
                allowLayerControl = currentFilter.some(st => st.sub_cat === "區域站");
            }

            const showCenter = allowLayerControl ? document.getElementById('layerCenter').checked : false;
            const showHub    = allowLayerControl ? document.getElementById('layerHub').checked : false;
            const showAuto   = allowLayerControl ? document.getElementById('layerAuto').checked : true;
            
            const showLinkAH = allowLayerControl ? document.getElementById('linkAutoHub').checked : false;
            const showLinkHR = allowLayerControl ? document.getElementById('linkHubReg').checked : false;
            const showLinkAR = allowLayerControl ? document.getElementById('linkAutoReg').checked : false;

            // 3. 🚀 完全同步 drawMap 的篩選清單
            let listToProcess = currentFilter ? [...currentFilter] : Object.values(allStations);
            if (allowLayerControl && currentFilter && showCenter) {
                Object.values(allStations).forEach(st => {
                    if (st.is_reg_center && !listToProcess.includes(st)) listToProcess.push(st);
                });
            }

            let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
            svg += `<rect width="100%" height="100%" fill="white" />`;

            const getPos = (lat, lon) => map.latLngToContainerPoint([lat, lon]);
            const _w = 1.5 + (zoom - 8) * 0.2; // 邊框粗細

            // 繪製 GeoJSON 海岸線
            if (geojsonData.features) {
                geojsonData.features.forEach(feat => {
                    const coords = feat.geometry.type === "Polygon" ? [feat.geometry.coordinates] : feat.geometry.coordinates;
                    coords.forEach(poly => poly.forEach(ring => {
                        let d = "M " + ring.map(p => {
                            let pt = getPos(p[1], p[0]); 
                            return pt.x + " " + pt.y;
                        }).join(" L ");
                        svg += `<path d="${d}" fill="none" stroke="#404040" stroke-width="0.5" />`;
                    }));
                });
            }

            // 4. 🚀 繪製連線 (完全同步 drawMap 的樣式與聚焦判斷)
            listToProcess.forEach(st => {
                if (!bounds.contains([st.lat, st.lon])) return;
                const inG = isInGroup(st);
                const p1 = getPos(st.lat, st.lon);

                // A. 中繼站-區域中心 (綠色長虛線)
                if (allowLayerControl && showLinkHR && st.is_hub && (!st.repid || !allStations[st.repid])) {
                    const center = regionalCenters[st.folder];
                    if (center) {
                        const p2 = getPos(center.lat, center.lon);
                        const cColor = inG ? '#38a169' : '#d4d4d4';
                        const cOpac  = inG ? 0.5 : 0.08;
                        svg += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${cColor}" stroke-width="1.8" stroke-dasharray="8,8" opacity="${cOpac}" />`;
                    }
                }

                // B. 直連自動站-區域中心 (藍色短虛線)
                if (allowLayerControl && showLinkAR && (!st.is_hub && !st.is_reg_center) && (!st.repid || !allStations[st.repid])) {
                    const center = regionalCenters[st.folder];
                    if (center) {
                        const p2 = getPos(center.lat, center.lon);
                        const isCurrentCenterLine = highlightedStation && highlightedStation.is_reg_center && (st.folder === highlightedStation.folder);
                        const cColor = inG ? '#3182ce' : '#d4d4d4';
                        const cWeight = isCurrentCenterLine ? 1.2 : 1.2;
                        const cDash = isCurrentCenterLine ? '0' : '2,4';
                        const cOpac = inG ? (isCurrentCenterLine ? 0.85 : 0.4) : 0.08;
                        svg += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${cColor}" stroke-width="${cWeight}" stroke-dasharray="${cDash}" opacity="${cOpac}" />`;
                    }
                }

                // C. 自動站-中繼站 (紅色點線)
                if (allowLayerControl && showLinkAH && st.repid && allStations[st.repid]) {
                    const p2 = getPos(allStations[st.repid].lat, allStations[st.repid].lon);
                    const isCurrentHubLine = highlightedStation && highlightedStation.is_hub && (st.repid === highlightedStation.rid);
                    const cColor = inG ? '#e53e3e' : '#d4d4d4';
                    const cWeight = isCurrentHubLine ? 1.2 : 1.2;
                    const cOpac = isCurrentHubLine ? 0.85 : (inG ? 0.35 : 0.08);
                    svg += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${cColor}" stroke-width="${cWeight}" stroke-dasharray="4,4" opacity="${cOpac}" />`;
                }
            });

            // 5. 🚀 繪製測站與站名文字 (同步 drawMap 樣式，包含淡化效果)
            listToProcess.forEach(st => {
                if (!bounds.contains([st.lat, st.lon])) return;
                const inG = isInGroup(st);
                
                let isVis = false;
                if (st.is_reg_center && showCenter) isVis = true;
                if (st.is_hub && showHub) isVis = true;
                if (!st.is_reg_center && !st.is_hub && showAuto) isVis = true;

                if (isVis) {
                    const p = getPos(st.lat, st.lon);
                    let color, r;
                    if (st.is_reg_center) { color = inG ? "#38a169" : "#d4d4d4"; r = Math.max(1, 7 + (zoom - 8) * 2); }
                    else if (st.is_hub) { color = inG ? "#e53e3e" : "#d4d4d4"; r = Math.max(1, 4.5 + (zoom - 8) * 1.5); }
                    else { color = inG ? "#4299e1" : "#d4d4d4"; r = Math.max(1, 3.8 + (zoom - 10) * 0.8); }

                    let fillOpac = inG ? 0.8 : 0.08;
                    let strokeColor = st.is_reg_center && inG ? "#f6e05e" : (inG ? "#ffffff" : "#d4d4d4");

                    svg += `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${color}" stroke="${strokeColor}" stroke-width="${_w}" fill-opacity="${fillOpac}" />`;
                    
                    // 🚀 拔除原本的強制顯示，同步 drawMap 乾淨的邏輯
                    let printName = false;
                    if (st.is_reg_center && inG && effCenter) printName = true;
                    if (st.is_hub && inG && effHub) printName = true;
                    if (!st.is_reg_center && !st.is_hub && inG && effAuto && _allowAuto) printName = true;

                    if (printName) {
                        svg += `<text x="${p.x+8}" y="${p.y+4}" font-family="Arial" font-size="10" font-weight="bold" fill="#1a202c">${st.n}</text>`;
                    }
                }
            });

            svg += `</svg>`;
            const blob = new Blob([svg], { type: "image/svg+xml" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url; link.download = "Map_Export.svg"; link.click();
        }
        
        function buildSidebar() {
            const container = document.getElementById('treeView');
            mainOrder.forEach(mKey => {
                const subs = treeData[mKey]; if (!subs) return;
                let mCount = 0; Object.values(subs).forEach(s => Object.values(s).forEach(f => mCount += countStations(f)));
                const mDet = document.createElement('details'); mDet.id = "main-" + mKey;
                const mSum = document.createElement('summary'); mSum.className = 'main-summary';
                mSum.innerHTML = `<span>📁 ${mKey}</span><span class="count-badge">${mCount}</span>`;
                mSum.onclick = () => focusMainCat(mKey);
                mDet.appendChild(mSum);
                let sOrder = (mKey === "署屬自動站") ? cwaSubOrder : Object.keys(subs).sort();
                sOrder.forEach(sKey => {
                    if (!subs[sKey]) return;
                    const folders = subs[sKey];
                    let sCount = 0; Object.values(folders).forEach(f => sCount += countStations(f));
                    const isFlat = (Object.keys(subs).length === 1 && (sKey === mKey || sKey === "None" || mKey === "民航局"));
                    if (isFlat && !Object.keys(folders).some(f => f !== "None")) {
                        folders["None"].forEach(node => mDet.appendChild(createRecursiveHTML(node)));
                    } else {
                        const sDet = document.createElement('details'); sDet.id = "sub-" + mKey + "-" + sKey;
                        const sSum = document.createElement('summary'); sSum.className = 'sub-summary';
                        sSum.innerHTML = `<span>📍 ${sKey}</span><span class="count-badge">${sCount}</span>`;
                        sSum.onclick = (e) => { e.stopPropagation(); focusGroupList(Object.values(folders).flat()); };
                        sDet.appendChild(sSum);
                        let fKeys = (sKey === "區域站") ? regionalOrder : Object.keys(folders).sort();
                        fKeys.forEach(fKey => {
                            if (!folders[fKey]) return;
                            if (fKey === "None") folders[fKey].forEach(n => sDet.appendChild(createRecursiveHTML(n)));
                            else {
                                const fDet = document.createElement('details'); fDet.id = "folder-" + sKey + "-" + fKey;
                                const fSum = document.createElement('summary'); fSum.className = 'folder-summary';
                                fSum.innerHTML = `<span>⭐ ${fKey}</span><span class="count-badge">${countStations(folders[fKey])}</span>`;
                                fSum.onclick = (e) => { e.stopPropagation(); focusGroupList(folders[fKey]); };
                                fDet.appendChild(fSum);
                                folders[fKey].forEach(n => fDet.appendChild(createRecursiveHTML(n)));
                                sDet.appendChild(fDet);
                            }
                        });
                        mDet.appendChild(sDet);
                    }
                });
                container.appendChild(mDet);
            });
        }

        // --- 關鍵修正：確保區域中心在聚焦模式下不消失 ---
        function drawMap(filter = null) {
            if (!map || typeof map.getZoom !== 'function') return;
            centerLayer.clearLayers();
            hubLayer.clearLayers();
            autoLayer.clearLayers();
            lineAutoHubLayer.clearLayers();
            lineCenterLayer.clearLayers();

            const zoom = map.getZoom(); 
            const isFocused = !!highlightedStation; 
            const bounds = map.getBounds(); 

            const effCenter = labelState.Center === null ? (zoom >= 7)  : labelState.Center;
            const effHub    = labelState.Hub    === null ? (zoom >= 10) : labelState.Hub;
            const effAuto   = labelState.Auto   === null ? isFocused    : labelState.Auto;

            const _allowAuto = zoom > 10 || isFocused;
            const _btnC = document.getElementById('nameBtnCenter');
            const _btnH = document.getElementById('nameBtnHub');
            const _btnA = document.getElementById('nameBtnAuto');
            if (_btnC) _btnC.classList.toggle('active', effCenter);
            if (_btnH) _btnH.classList.toggle('active', effHub);
            if (_btnA) {
                _btnA.disabled = !_allowAuto;
                _btnA.title = _allowAuto ? '顯示/隱藏站名' : '請放大至縣市層級（zoom > 10）才可啟用';
                _btnA.classList.toggle('active', effAuto); 
            }

            // 🚀 修正 1：先決定要處理的清單！確保點擊 checkbox 時能讀取到 currentFilter
            let listToProcess = filter ? [...filter] : (currentFilter ? [...currentFilter] : Object.values(allStations));

            // 🚀 修正 2：根據確定的清單來判斷是否解鎖圖層控制
            let allowLayerControl = true;
            if (listToProcess && listToProcess.length > 0) {
                allowLayerControl = listToProcess.some(st => st.sub_cat === "區域站");
            }

            // A. 取得 UI 控制狀態
            const showCenter = allowLayerControl ? document.getElementById('layerCenter').checked : false;
            const showHub    = allowLayerControl ? document.getElementById('layerHub').checked : false;
            const showAuto   = allowLayerControl ? document.getElementById('layerAuto').checked : true;
            
            const showLinkAH = allowLayerControl ? document.getElementById('linkAutoHub').checked : false;
            const showLinkHR = allowLayerControl ? document.getElementById('linkHubReg').checked : false;
            const showLinkAR = allowLayerControl ? document.getElementById('linkAutoReg').checked : false; 
            
            // UI 狀態同步
            const elementsToToggle = [
                { id: 'layerCenter', parent: true },
                { id: 'layerHub', parent: true },
                { id: 'linkAutoHub', parent: true },
                { id: 'linkHubReg', parent: true },
                { id: 'linkAutoReg', parent: true },
                { id: 'nameBtnCenter', parent: false },
                { id: 'nameBtnHub', parent: false }
            ];

            elementsToToggle.forEach(item => {
                const el = document.getElementById(item.id);
                if (el) {
                    el.disabled = !allowLayerControl;
                    if (item.parent && el.parentElement) {
                        el.parentElement.style.opacity = allowLayerControl ? "1" : "0.5";
                        el.parentElement.style.cursor = allowLayerControl ? "pointer" : "not-allowed";
                    }
                }
            });

            const autoInput = document.getElementById('layerAuto');
            if (autoInput) {
                autoInput.disabled = !allowLayerControl;
                if (!allowLayerControl) autoInput.checked = true; 
                if (autoInput.parentElement) {
                    autoInput.parentElement.style.opacity = allowLayerControl ? "1" : "0.5";
                    autoInput.parentElement.style.cursor = allowLayerControl ? "pointer" : "not-allowed";
                }
            }

            // 🚀 修正 3：補回區域中心的判斷，改用 (filter || currentFilter) 確保點擊勾選框時中心站不會消失
            if (allowLayerControl && (filter || currentFilter) && showCenter) {
                Object.values(allStations).forEach(st => {
                    if (st.is_reg_center && !listToProcess.includes(st)) listToProcess.push(st);
                });
            }

            // ★ 分 5 Pass 繪製，確保 SVG 疊圖順序正確 ★

            const _openPopupFor = pendingPopupStation;
            pendingPopupStation = null;

            const _centerCnt = {}; 
            const _hubCnt = new Map(); 
            Object.values(allStations).forEach(s => {
                if (s.is_hub && s.folder) {
                    if (!_centerCnt[s.folder]) _centerCnt[s.folder] = { hubs: 0, autos: 0 };
                    _centerCnt[s.folder].hubs++;
                } else if (!s.is_reg_center && !s.is_hub) {
                    if (s.repid && allStations[s.repid]) {
                        const hub = allStations[s.repid];
                        if (!_hubCnt.has(hub)) _hubCnt.set(hub, { autos: 0 });
                        _hubCnt.get(hub).autos++;
                        if (hub.folder) {
                            if (!_centerCnt[hub.folder]) _centerCnt[hub.folder] = { hubs: 0, autos: 0 };
                            _centerCnt[hub.folder].autos++;
                        }
                    } else if (s.folder) {
                        if (!_centerCnt[s.folder]) _centerCnt[s.folder] = { hubs: 0, autos: 0 };
                        _centerCnt[s.folder].autos++;
                    }
                }
            });
            const _popup = st => {
                let statsHTML = '';
                if (st.is_reg_center && st.folder && _centerCnt[st.folder]) {
                    const cnt = _centerCnt[st.folder];
                    statsHTML = `<tr><th>管轄中繼站</th><td><b>${cnt.hubs}</b> 站</td></tr><tr><th>管轄自動站</th><td><b>${cnt.autos}</b> 站</td></tr>`;
                } else if (st.is_hub && _hubCnt.has(st)) {
                    statsHTML = `<tr><th>管轄自動站</th><td><b>${_hubCnt.get(st).autos}</b> 站</td></tr>`;
                }
                return `<div style="min-width:280px;"><b style="font-size:15px; color:#2d3748;">${st.n}</b>
                    <hr style="border:0; border-top:1px solid #edf2f7; margin:8px 0;">
                    <table class="info-table">
                        <tr><th>區域站</th><td>${st.reg}</td></tr>
                        <tr><th>站碼</th><td>${st.cwbid}</td></tr>
                        <tr><th>無線電站碼</th><td>${st.sid}</td></tr>
                        <tr><th>座標</th><td>${st.lat.toFixed(5)}, ${st.lon.toFixed(5)}</td></tr>
                        <tr><th>地址</th><td>${st.addr}</td></tr>${statsHTML}
                    </table>
                    </div>`;
            };
            const _w = 1.5 + (zoom - 8) * 0.2; 
            
            // Pass 1/5：區域中心相關連線
            listToProcess.forEach(st => {
                if (allowLayerControl && showLinkHR && st.is_hub && (!st.repid || !allStations[st.repid])) {
                    const center = regionalCenters[st.folder];
                    const inG = isInGroup(st);
                    if (center) L.polyline([[st.lat, st.lon], [center.lat, center.lon]], {
                        color: inG ? '#38a169' : '#d4d4d4', weight: 1.8,
                        opacity: inG ? 0.5 : 0.08, dashArray: '8,8'
                    }).addTo(lineCenterLayer);
                }

                if (allowLayerControl && showLinkAR && (!st.is_hub && !st.is_reg_center) && (!st.repid || !allStations[st.repid])) {
                    const center = regionalCenters[st.folder];
                    const inG = isInGroup(st);
                    if (center) {
                        const isCurrentCenterLine = highlightedStation && highlightedStation.is_reg_center && (st.folder === highlightedStation.folder);
                        L.polyline([[st.lat, st.lon], [center.lat, center.lon]], {
                            color: inG ? '#3182ce' : '#d4d4d4', 
                            // 🚀 修正 4：幫你稍微把聚焦時加粗 (2.5)，不然前後都是 1.2 會看不出變化
                            weight: isCurrentCenterLine ? 1.2 : 1.2, 
                            opacity: inG ? (isCurrentCenterLine ? 0.85 : 0.4) : 0.08, 
                            // 🚀 修正 5：把 '2.4' 的小數點改回逗號 '2,4'，維持點狀虛線！
                            dashArray: '2,4'
                        }).addTo(lineCenterLayer);
                    }
                }
            });
            
            // Pass 2/5：自動站-中繼站 連線
            listToProcess.forEach(st => {
                if (allowLayerControl && showLinkAH && st.repid && allStations[st.repid]) {
                    const inG = isInGroup(st);
                    const isCurrentHubLine = highlightedStation && highlightedStation.is_hub && (st.repid === highlightedStation.rid);
                    L.polyline([[st.lat, st.lon], [allStations[st.repid].lat, allStations[st.repid].lon]], {
                        color: inG ? '#e53e3e' : '#d4d4d4', 
                        // 🚀 修正 6：同樣幫你把聚焦加粗，維持視覺引導
                        weight: isCurrentHubLine ? 1.2 : 1.2,
                        opacity: isCurrentHubLine ? 0.85 : (inG ? 0.35 : 0.08), 
                        dashArray: '4,4'
                    }).addTo(lineAutoHubLayer);
                }
            });
            // Pass 3/5：自動站 markers（點位最下層）
            // 基本邏輯：基礎值 + (目前縮放 - 初始縮放) * 增量
            if (showAuto) listToProcess.forEach(st => {
                if (st.is_reg_center || st.is_hub) return;
                const inG = isInGroup(st);
                const m = L.circleMarker([st.lat, st.lon], {
                    radius: Math.max(1, 3.8 + (zoom - 10) * 0.8),
                    fillColor: inG ? '#4299e1' : '#d4d4d4',
                    color: inG ? '#fff' : '#d4d4d4', weight: _w,
                    fillOpacity: inG ? 0.8 : 0.08
                }).addTo(autoLayer);
                m.bindPopup(_popup(st));
                if (st === _openPopupFor) m.openPopup();
                
                // 🚀 關鍵修改：拔除原本霸道的強制顯示，完全聽從 effAuto 與 _allowAuto 的指示
                if (inG && effAuto && _allowAuto && bounds.contains([st.lat, st.lon])) {
                    m.bindTooltip(st.n, { permanent: true, direction: 'right', offset: [5, 0], className: 'station-name-label' });
                }
            });
            // Pass 4/5：中繼站 markers（點擊可聚焦轄下測站）
            if (showHub) listToProcess.forEach(st => {
                if (!st.is_hub) return;
                const inG = isInGroup(st);
                const m = L.circleMarker([st.lat, st.lon], {
                    radius: Math.max(1, 4.5 + (zoom - 8) * 1.5),
                    fillColor: inG ? '#e53e3e' : '#d4d4d4',
                    color: inG ? '#fff' : '#d4d4d4', weight: _w,
                    fillOpacity: inG ? 0.8 : 0.08
                }).addTo(hubLayer);
                m.bindPopup(_popup(st));
                if (st === _openPopupFor) m.openPopup();
                if (inG && effHub) m.bindTooltip(st.n, { permanent: true, direction: 'right', offset: [5, 0], className: 'station-name-label' });
                // 點擊切換聚焦（同一站再點取消）；popup 由 pendingPopupStation 在下次 drawMap 後重開
                m.on('click', function(e) {
                    if (e && e.originalEvent) e.originalEvent.stopPropagation(); // 🚀 關鍵新增：防止點擊事件穿透到地圖空白處
                    const isSame = (highlightedStation === st);
                    highlightedStation = isSame ? null : st;
                    pendingPopupStation = isSame ? null : st;
                    drawMap(currentFilter);
                });
            });
            // Pass 5/5：區域中心 markers（最頂層，點擊可聚焦轄下測站）
            if (showCenter) listToProcess.forEach(st => {
                if (!st.is_reg_center) return;
                const inG = isInGroup(st);
                const m = L.circleMarker([st.lat, st.lon], {
                    radius: Math.max(1, 7 + (zoom - 8) * 2),
                    fillColor: inG ? '#38a169' : '#d4d4d4',
                    color: inG ? '#f6e05e' : '#d4d4d4', weight: _w,
                    fillOpacity: inG ? 0.8 : 0.08
                }).addTo(centerLayer);
                m.bindPopup(_popup(st));
                if (st === _openPopupFor) m.openPopup();
                if (inG && effCenter) m.bindTooltip(st.n, { permanent: true, direction: 'right', offset: [5, 0], className: 'station-name-label' });
                // 點擊切換聚焦（同一站再點取消）；popup 由 pendingPopupStation 在下次 drawMap 後重開
                m.on('click', function(e) {
                    if (e && e.originalEvent) e.originalEvent.stopPropagation(); // 🚀 關鍵新增：防止點擊事件穿透到地圖空白處
                    const isSame = (highlightedStation === st);
                    highlightedStation = isSame ? null : st;
                    pendingPopupStation = isSame ? null : st;
                    drawMap(currentFilter);
                });
            });
        }

        function focusMainCat(mKey) { 
            highlightedStation = null; // 🚀 關鍵新增：切換目錄時，自動解除右側點選聚焦狀態
            const nodes = []; 
            // 取得該大類下所有的站點
            Object.values(treeData[mKey]).forEach(sub => {
            Object.values(sub).forEach(folder => {
                folder.forEach(n => nodes.push(...getAll(n)));
            });
        }); 
            // 🚀 關鍵修正：更新全域過濾器狀態
            currentFilter = nodes;
            // 🚀 新增：立刻重新繪製地圖點位
            drawMap(currentFilter);

            if (nodes.length > 0) {
                const focusCoords = nodes
                    .filter(s => s.lat > 21.0 && s.lon > 117.5)
                    .map(s => [s.lat, s.lon]);
                
                // 防呆機制：如果過濾後沒半個點（例如未來真的只有單獨點選東沙島目錄），就用原本的全部點
                const finalCoords = focusCoords.length > 0 ? focusCoords : nodes.map(s => [s.lat, s.lon]);
                const bounds = L.latLngBounds(finalCoords);
                map.fitBounds(bounds, { padding: [50, 50] });
            }   
        }
        function focusGroupList(nodes) { 
            highlightedStation = null; // 🚀 關鍵新增：切換目錄時，自動解除右側點選聚焦狀態
            const all = nodes.flatMap(n => getAll(n));
            currentFilter = all; 
            drawMap(currentFilter); 
            
            if (all.length > 0) {
                // 🚀 關鍵修改：同樣在計算視野時排除東沙、南沙
                const focusCoords = all
                    .filter(s => s.lat > 21.0 && s.lon > 117.5)
                    .map(s => [s.lat, s.lon]);
                
                const finalCoords = focusCoords.length > 0 ? focusCoords : all.map(s => [s.lat, s.lon]);
                const bounds = L.latLngBounds(finalCoords);
                map.fitBounds(bounds, { padding: [40, 40] });
            } 
        }
        // 🚀 關鍵修改：補上全域過濾器同步
        function focusGroup(n) { 
            highlightedStation = null; // 🚀 關鍵新增：切換目錄時，自動解除右側點選聚焦狀態
            const g = getAll(n); 
            currentFilter = g; 
            drawMap(g); 
            
            // 🚀 關鍵修改：同樣在計算視野時排除東沙、南沙
            const focusCoords = g
                .filter(s => s.lat > 21.0 && s.lon > 117.5)
                .map(s => [s.lat, s.lon]);
            
            const finalCoords = focusCoords.length > 0 ? focusCoords : g.map(s => [s.lat, s.lon]);
            map.fitBounds(L.latLngBounds(finalCoords), { padding: [40, 40] }); 
        }
        function getAll(node, list = []) { list.push(node); if(node.children) node.children.forEach(c => getAll(c, list)); return list; }
        function focusPoint(st) { 
            map.setView([st.lat, st.lon], 14); 
            // 修正：因為 markerLayer 已經被拆分，必須遍歷這三個圓點圖層來尋找對應的 Marker
            [centerLayer, hubLayer, autoLayer].forEach(layer => {
                layer.eachLayer(m => { 
                    if (m.getLatLng && m.getLatLng().lat === st.lat && m.getLatLng().lng === st.lon) {
                        m.openPopup(); 
                    } 
                }); 
            });
        }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); setTimeout(() => map.invalidateSize(), 350); }
        function collapseAll() { document.querySelectorAll('#treeView details').forEach(d => d.open = false); document.querySelectorAll('.st-item').forEach(el => el.classList.remove('active-highlight')); }
        function resetMap() { 
            currentFilter = null; // 🚀 清空過濾器，代表顯示全部
            drawMap(); 
            map.setView([23.7, 121.0], 8); 
        }


        // 判斷 st 是否在目前聚焦範圍內（highlightedStation 為 null 時全員 in-group）
        function isInGroup(st) {
            if (!highlightedStation) return true;
            if (st === highlightedStation || st.rid === highlightedStation.rid) return true;
            const hSt = highlightedStation;
            
            if (hSt.is_reg_center) {
                // 1. 如果點擊的是【區域中心】
                if (st.is_hub) return st.folder === hSt.folder; // 同 folder 的中繼站
                
                if (!st.is_reg_center && !st.is_hub) { // 自動站的狀況：
                    if (st.repid && allStations[st.repid]) {
                        // 有經中繼站：看該中繼站的 folder 是否符合
                        const hub = allStations[st.repid];
                        return hub && hub.folder === hSt.folder;
                    } else {
                        // 🚀 新增直連判定：沒有中繼站，直接比對自己的 folder 是否符合該區域中心
                        return st.folder === hSt.folder;
                    }
                }
                return false;
            }
            
            if (hSt.is_hub) {
                // 2. 如果點擊的是【中繼站】
                // 直連自動站沒有中繼站（repid 為空），這裡會自動回傳 false，符合邏輯
                if (!st.is_reg_center && !st.is_hub && st.repid)
                    return st.repid === hSt.rid;
                return false;
            }
            return false;
        }

        function toggleName(type) {
            const zoom = map ? map.getZoom() : 0;
            const isFocused = !!highlightedStation; // 🚀 新增判斷
            
            let autoOn = false;
            if (type === 'Center') autoOn = (zoom >= 7);
            else if (type === 'Hub') autoOn = (zoom >= 10);
            else if (type === 'Auto') autoOn = isFocused; // 🚀 自動站在聚焦模式下的預設是「顯示」
            
            const cur = labelState[type];
            // 這樣一來，如果在聚焦模式 (autoOn = true)，你點擊按鈕，它就會正確切換成 false (強制隱藏)！
            labelState[type] = (cur === null) ? (autoOn ? false : true) : null;
            drawMap(currentFilter);
        }

        window.onload = () => { loadDataAndInit(); lucide.createIcons(); };
    </script>
</body>
