<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>測站通訊監控系統</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        :root { 
            --sidebar-width: 400px; --primary: #2c3e50; --active-blue: #3182ce; 
            --hub-color: #e53e3e; --reg-color: #38a169; --tree-line: #e2e8f0;
            --auto-color: #4299e1;
        }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: "Inter", "Microsoft JhengHei", sans-serif; background: #f7fafc; }
        .wrapper { display: flex; height: 100%; width: 100%; position: relative; overflow: hidden; }
        
        #sidebar { width: var(--sidebar-width); height: 100%; background: white; border-right: 1px solid #edf2f7; display: flex; flex-direction: column; z-index: 2000; transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-width)); }
        
        /* 標題欄位：padding-top 確保不被選單按鈕擋住 */
        .header { padding: 24px; padding-top: 70px; background: var(--primary); color: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .header h3 { margin: 0; font-size: 18px; letter-spacing: 1px; }
        
        .search-box { padding: 16px; background: white; border-bottom: 1px solid #edf2f7; position: relative; }
        #searchInput { width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 12px; outline: none; font-size: 14px; transition: all 0.2s; }
        #searchInput:focus { border-color: var(--active-blue); box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15); }
        .clear-btn { position: absolute; right: 28px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #a0aec0; font-size: 18px; display: none; }

        .toolbar { padding: 12px 16px; background: #f8fafc; border-bottom: 1px solid #edf2f7; display: flex; gap: 8px; }
        .tool-btn { flex: 1; padding: 8px; font-size: 13px; cursor: pointer; background: white; border: 1px solid #e2e8f0; border-radius: 8px; font-weight: 600; color: #4a5568; transition: all 0.2s; }
        .tool-btn:hover { background: #edf2f7; border-color: #cbd5e0; }

        .tree { flex-grow: 1; overflow-y: auto; padding: 12px 0; scroll-behavior: smooth; }
        details { margin-left: 18px; border-left: 1.5px solid var(--tree-line); position: relative; }
        details::before { content: ""; position: absolute; top: 20px; left: 0; width: 10px; border-top: 1.5px solid var(--tree-line); }
        summary { padding: 10px; padding-left: 14px; cursor: pointer; font-weight: 700; color: #2d3748; list-style: none; border-radius: 8px; display: flex; align-items: center; position: relative; transition: background 0.2s; }
        summary:hover { background: #f7fafc; }
        summary::after { content: '▹'; position: absolute; left: -11px; color: #a0aec0; background: white; width: 16px; text-align: center; font-size: 11px; }
        details[open] > summary::after { content: '▿'; }
        .count-badge { font-size: 11px; color: #718096; background: #edf2f7; padding: 2px 8px; border-radius: 20px; margin-left: 8px; }
        .main-summary { background: #f1f5f9 !important; font-size: 15px; margin-left: -10px; border-left: none !important; }

        .st-item { padding: 9px 14px; margin-left: 22px; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; border-radius: 8px; position: relative; margin-bottom: 2px; border-bottom: 1px solid #f9f9f9; }
        .st-item::before { content: ""; position: absolute; left: -22px; top: 50%; width: 22px; border-top: 1.5px solid var(--tree-line); }
        .st-item:hover { background: #ebf8ff; color: #2b6cb0; }
        .st-item.active-highlight { background: var(--active-blue) !important; color: white !important; font-weight: 700; z-index: 5; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .st-item.active-highlight::before { border-top-color: var(--active-blue); }
        .badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; color: white; background: #4299e1; margin-left: auto; flex-shrink: 0; }
        .badge.hub { background: var(--hub-color); }

        /* 地圖控制盒優化：支援收摺 */
        #map { flex-grow: 1; height: 100%; position: relative; background: #f0f2f5; }
        .map-controls {
            position: absolute; top: 20px; right: 20px; z-index: 3000;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            padding: 0; border-radius: 12px; border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); font-size: 13px; width: 180px;
            overflow: hidden;
        }
        .map-controls label { display: flex; align-items: center; cursor: pointer; gap: 10px; font-weight: 600; color: #4a5568; margin-bottom: 8px; }
        /* 控制盒標題按鈕 */
        .map-controls summary {
            padding: 12px; cursor: pointer; font-weight: 800; color: #2d3748;
            list-style: none; display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.5);
        }
        .map-controls summary::after { content: '⚙️'; font-size: 14px; }
        .map-controls[open] summary { border-bottom: 2px solid #edf2f7; }

        .map-controls .content { padding: 12px; }
        .map-controls label { display: flex; align-items: center; cursor: pointer; gap: 10px; font-weight: 600; color: #4a5568; margin-bottom: 8px; }
        .map-controls input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--active-blue); }

        @media (max-width: 768px) { 
            :root { --sidebar-width: 85%; } 
            #sidebar { position: absolute; } 
            .map-controls { top: 85px; right: 10px; width: 150px; } /* 手機版位置微調 */
        }
        /* 選單按鈕：置於最頂層 */
        .menu-toggle { position: absolute; top: 20px; left: 20px; z-index: 3001; background: white; padding: 12px 18px; border-radius: 10px; cursor: pointer; font-weight: 700; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1.5px solid #edf2f7; }
        
        .info-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
        .info-table th { text-align: left; color: #718096; width: 90px; padding: 6px 8px; border-bottom: 1px solid #edf2f7; background: #f8fafc; }
        .info-table td { padding: 6px 8px; color: #2d3748; border-bottom: 1px solid #edf2f7; word-break: break-all; }

        @media (max-width: 768px) { :root { --sidebar-width: 85%; } #sidebar { position: absolute; } .map-controls { top: 85px; right: 10px; } }
    </style>

</head>
<body>
    <div class="menu-toggle" onclick="toggleSidebar()">≡ 選單</div>
    <div class="wrapper">
        <div id="sidebar">
            <div class="header">
                <h3>測站通訊監控系統</h3>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 搜尋站名或代碼..." oninput="handleSearch()">
                <span id="clearBtn" class="clear-btn" onclick="clearSearch()">✖</span>
            </div>
            <div class="toolbar">
                <button class="tool-btn" onclick="collapseAll()">一鍵收合目錄</button>
                <button class="tool-btn" onclick="resetMap()">全台視圖</button>
                <button class="tool-btn" onclick="generateSVGExport()">📥 下載SVG</button>
            </div>
            <div class="tree" id="treeView"></div>
            <div class="tree" id="searchResults"></div>
        </div>

        <div id="map">
            <details class="map-controls" open>
                <summary>圖層設定</summary>
                <div class="content">
                    <label><input type="checkbox" id="layerCenter" checked onchange="drawMap()"> <span style="color:var(--reg-color);">●</span> 區域中心</label>
                    <label><input type="checkbox" id="layerHub" checked onchange="drawMap()"> <span style="color:var(--hub-color);">●</span> 中繼站</label>
                    <label><input type="checkbox" id="layerAuto" checked onchange="drawMap()"> <span style="color:var(--auto-color);">●</span> 自動站</label>
                    <hr style="border:0; border-top:1.5px solid #edf2f7; margin:10px 0;">
                    <label><input type="checkbox" id="linkAutoHub" checked onchange="drawMap()"> <span style="color:var(--hub-color); opacity:0.6;">---</span> 自動站-中繼站</label>
                    <label><input type="checkbox" id="linkHubReg" checked onchange="drawMap()"> <span style="color:var(--reg-color); opacity:0.8;">---</span> 中繼站-區域站</label>
                    <label><input type="checkbox" id="showLabels" checked onchange="drawMap()"> 列印站名標籤</label>
                </div>
            </details>
        </div>
    </div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let geojsonData, treeData, mainOrder, cwaSubOrder, regionalOrder, regionalCenters, allStations;
        let map, markerLayer, lineLayer, currentFilter = null;

        async function loadDataAndInit() {
            try {
                // 同時下載兩個檔案，速度更快！
                const [resData, resGeo] = await Promise.all([
                    fetch('stationData.json'),
                    fetch('taiwan.json') // 👈 直接讀取原始地圖檔
                ]);
                const d = await resData.json();
                const g = await resGeo.json();

                geojsonData = g; // 👈 地圖資料來自獨立的檔案
                treeData = d.treeData;
                mainOrder = d.mainOrder;
                cwaSubOrder = d.cwaSubOrder;
                regionalOrder = d.regionalOrder;
                regionalCenters = d.regionalCenters;
                allStations = d.allStations;
                initMap();
            } catch (e) { console.error("Data Load Error:", e); }
        }
        // --- 初始化地圖 ---
        function initMap() {
            map = L.map('map', { 
                zoomControl: false,
                zoomSnap: 0.1,    // 允許停在非整數的縮放層級 (例如 8.2)
                zoomDelta: 0.1,   // 每次縮放變化的幅度
                wheelPxPerZoomLevel: 120 // 調整滾輪靈敏度 (數值越大越慢/越精確)
                }).setView([23.7, 121.0], 8);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '© CartoDB' }).addTo(map);
            if (geojsonData.type) {
            L.geoJSON(geojsonData, {
                style: { color: '#404040', weight: 0.5, fillOpacity: 0.05, fillColor: '#f8fafc' }
            }).addTo(map);
        }
            markerLayer = L.layerGroup().addTo(map);
            lineLayer = L.layerGroup().addTo(map);
            buildSidebar();
            drawMap();
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            setTimeout(() => map.invalidateSize(), 500);
            
            // 如果是手機版，初始化後自動關閉圖層控制盒
            if (window.innerWidth < 768) {
                document.querySelector('.map-controls').open = false;
            }
        }

        function countStations(nodes) {
            let count = 0;
            nodes.forEach(node => { if (node.rid) count++; if (node.children) count += countStations(node.children); });
            return count;
        }

        function highlightListItem(rid) {
            document.querySelectorAll('.st-item').forEach(el => el.classList.remove('active-highlight'));
            const target = document.getElementById("item-" + rid);
            if (target) { target.classList.add('active-highlight'); target.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        }

        function navigateToStation(rid) {
            const st = allStations[rid];
            clearSearch();
            const mEl = document.getElementById("main-" + st.main_cat), sEl = document.getElementById("sub-" + st.main_cat + "-" + st.sub_cat), fEl = document.getElementById("folder-" + st.sub_cat + "-" + st.folder);
            if (mEl) mEl.open = true; if (sEl) sEl.open = true; if (fEl) fEl.open = true;
            highlightListItem(rid); focusPoint(st);
        }

        function handleSearch() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const treeV = document.getElementById('treeView'), resV = document.getElementById('searchResults'), btn = document.getElementById('clearBtn');
            
            if (q === "") { clearSearch(); return; }
            
            btn.style.display = "block"; 
            treeV.style.display = "none"; 
            resV.style.display = "block"; 
            resV.innerHTML = "";
            
            // 搜尋邏輯
            const matches = Object.values(allStations).filter(st => 
                st.n.toLowerCase().includes(q) || 
                st.sid.toLowerCase().includes(q) || 
                st.cwbid.toLowerCase().includes(q)
            );

            matches.forEach(st => {
                const div = document.createElement('div');
                div.className = 'st-item'; 
                div.style.marginLeft = "5px"; 
                
                // 這裡移除了反斜線，只保留雙大括號 ${ }
                div.innerHTML = `
                    <div style="display: flex; flex-direction: column; flex-grow: 1;">
                        <span style="font-weight: bold; color: #2d3748;">${st.n}</span>
                        <span style="font-size: 11px; color: #718096;">代碼: ${st.sid} / ${st.cwbid}</span>
                    </div>
                    <span class="badge ${st.is_hub ? 'hub' : ''}">${st.is_hub ? '中繼' : '自動'}</span>
                `;

                div.onclick = () => {
                    if(window.innerWidth < 768) toggleSidebar(true);
                    navigateToStation(st.rid);
                };
                resV.appendChild(div);
            });
        }

        function clearSearch() {
            document.getElementById('searchInput').value = ""; document.getElementById('clearBtn').style.display = "none";
            document.getElementById('treeView').style.display = "block"; document.getElementById('searchResults').style.display = "none";
        }

        function createRecursiveHTML(node) {
            if (node.children && node.children.length > 0) {
                const det = document.createElement('details');
                const sum = document.createElement('summary');
                sum.innerHTML = `<span><span style="${node.is_hub?'color:var(--hub-color)':''}">${node.n}</span><span class="count-badge">${countStations(node.children)}</span></span>`;
                sum.onclick = (e) => { e.stopPropagation(); focusGroup(node); };
                det.appendChild(sum);
                node.children.forEach(c => det.appendChild(createRecursiveHTML(c)));
                return det;
            } else {
                const div = document.createElement('div');
                div.className = 'st-item'; div.id = "item-" + node.rid;
                div.innerHTML = `<span>${node.n}</span><span class="badge ${node.is_hub?'hub':''}">${node.is_hub?'中繼':'自動'}</span>`;
                div.onclick = (e) => { e.stopPropagation(); highlightListItem(node.rid); focusPoint(node); };
                return div;
            }
        }
        
        function generateSVGExport() {
            const bounds = map.getBounds();
            const size = map.getSize();
            const w = size.x, h = size.y;
            // 讀取「顯示站名標籤」的勾選狀態
            const showLabels = document.getElementById('showLabels').checked;
            


            // 讀取 UI 的連線與圖層開關狀態
            const showHub = document.getElementById('layerHub').checked;
            const showCenter = document.getElementById('layerCenter').checked;
            const showAuto = document.getElementById('layerAuto').checked;
            const showLinkAH = document.getElementById('linkAutoHub').checked; // 自動站-中繼站開關
            const showLinkHR = document.getElementById('linkHubReg').checked;  // 中繼站-區域站開關

            let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
            svg += `<rect width="100%" height="100%" fill="white" />`;

            const getPos = (lat, lon) => map.latLngToContainerPoint([lat, lon]);

            // 1. 繪製 GeoJSON 海岸線 (從讀取的檔案)；這裡的設定不是畫在地圖上而是畫在你「下載的 SVG 檔案裡」。
            if (geojsonData.features) {
                geojsonData.features.forEach(feat => {
                    const coords = feat.geometry.type === "Polygon" ? [feat.geometry.coordinates] : feat.geometry.coordinates;
                    coords.forEach(poly => poly.forEach(ring => {
                        let d = "M " + ring.map(p => {
                            let pt = getPos(p[1], p[0]); // GeoJSON 是 [Lon, Lat]
                            return pt.x + " " + pt.y;
                        }).join(" L ");
                        svg += `<path d="${d}" fill="none" stroke="#404040" stroke-width="0.5" />`;
                    }));
                });
            }

            // 2. 繪製連線 (連動連線開關)
            Object.values(allStations).forEach(st => {
                if (bounds.contains([st.lat, st.lon])) {
                    const p1 = getPos(st.lat, st.lon);
                    // 自動站-中繼站連線
                    if (showLinkAH && st.repid && allStations[st.repid]) {
                        const p2 = getPos(allStations[st.repid].lat, allStations[st.repid].lon);
                        svg += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#e53e3e" stroke-width="1" stroke-dasharray="4,4" opacity="0.4" />`;
                    }
                    // 中繼站-區域中心連線
                    if (showLinkHR && st.is_hub && (!st.repid || !allStations[st.repid])) {
                        const center = regionalCenters[st.folder];
                        if (center) {
                            const p2 = getPos(center.lat, center.lon);
                            svg += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#38a169" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.6" />`;
                        }
                    }
                }
            });

            // 3. 繪製測站
            Object.values(allStations).forEach(st => {
                if (bounds.contains([st.lat, st.lon])) {
                    let isVis = (st.is_reg_center && showCenter) || (st.is_hub && showHub) || (!st.is_reg_center && !st.is_hub && showAuto);
                    if (isVis) {
                        const p = getPos(st.lat, st.lon);
                        let color = st.is_reg_center ? "#38a169" : (st.is_hub ? "#e53e3e" : "#4299e1");
                        svg += `<circle cx="${p.x}" cy="${p.y}" r="${st.is_reg_center?6:st.is_hub?4:2}" fill="${color}" stroke="white" stroke-width="1" />`;
                        // 修正點：只有在勾選「顯示站名標籤」時，才繪製文字
                        if (showLabels && (st.is_reg_center || st.is_hub)) {
                            svg += `<text x="${p.x+8}" y="${p.y+4}" font-family="Arial" font-size="10" font-weight="bold" fill="#1a202c">${st.n}</text>`;
                        }
                    }
                }
            });

            svg += `</svg>`;
            const blob = new Blob([svg], { type: "image/svg+xml" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url; link.download = "Map_Export.svg"; link.click();
        }
        
        function buildSidebar() {
            const container = document.getElementById('treeView');
            mainOrder.forEach(mKey => {
                const subs = treeData[mKey]; if (!subs) return;
                let mCount = 0; Object.values(subs).forEach(s => Object.values(s).forEach(f => mCount += countStations(f)));
                const mDet = document.createElement('details'); mDet.id = "main-" + mKey;
                const mSum = document.createElement('summary'); mSum.className = 'main-summary';
                mSum.innerHTML = `<span>📁 ${mKey}</span><span class="count-badge">${mCount}</span>`;
                mSum.onclick = () => focusMainCat(mKey);
                mDet.appendChild(mSum);
                let sOrder = (mKey === "署屬自動站") ? cwaSubOrder : Object.keys(subs).sort();
                sOrder.forEach(sKey => {
                    if (!subs[sKey]) return;
                    const folders = subs[sKey];
                    let sCount = 0; Object.values(folders).forEach(f => sCount += countStations(f));
                    const isFlat = (Object.keys(subs).length === 1 && (sKey === mKey || sKey === "None" || mKey === "民航局"));
                    if (isFlat && !Object.keys(folders).some(f => f !== "None")) {
                        folders["None"].forEach(node => mDet.appendChild(createRecursiveHTML(node)));
                    } else {
                        const sDet = document.createElement('details'); sDet.id = "sub-" + mKey + "-" + sKey;
                        const sSum = document.createElement('summary'); sSum.className = 'sub-summary';
                        sSum.innerHTML = `<span>📍 ${sKey}</span><span class="count-badge">${sCount}</span>`;
                        sSum.onclick = (e) => { e.stopPropagation(); focusGroupList(Object.values(folders).flat()); };
                        sDet.appendChild(sSum);
                        let fKeys = (sKey === "區域站") ? regionalOrder : Object.keys(folders).sort();
                        fKeys.forEach(fKey => {
                            if (!folders[fKey]) return;
                            if (fKey === "None") folders[fKey].forEach(n => sDet.appendChild(createRecursiveHTML(n)));
                            else {
                                const fDet = document.createElement('details'); fDet.id = "folder-" + sKey + "-" + fKey;
                                const fSum = document.createElement('summary'); fSum.className = 'folder-summary';
                                fSum.innerHTML = `<span>⭐ ${fKey}</span><span class="count-badge">${countStations(folders[fKey])}</span>`;
                                fSum.onclick = (e) => { e.stopPropagation(); focusGroupList(folders[fKey]); };
                                fDet.appendChild(fSum);
                                folders[fKey].forEach(n => fDet.appendChild(createRecursiveHTML(n)));
                                sDet.appendChild(fDet);
                            }
                        });
                        mDet.appendChild(sDet);
                    }
                });
                container.appendChild(mDet);
            });
        }

        // --- 關鍵修正：確保區域中心在聚焦模式下不消失 ---
        function drawMap(filter = null) {
            markerLayer.clearLayers(); lineLayer.clearLayers();
            const showCenter = document.getElementById('layerCenter').checked;
            const showHub = document.getElementById('layerHub').checked;
            const showAuto = document.getElementById('layerAuto').checked;
            const showAutoHubLink = document.getElementById('linkAutoHub').checked;
            const showHubRegLink = document.getElementById('linkHubReg').checked;
            const showLabels = document.getElementById('showLabels').checked; // 新增這行
            
            // 核心改動：如果正在聚焦特定子集 (filter)，我們強制把所有區域中心補進去
            let listToProcess = filter ? [...filter] : Object.values(allStations);
            if (filter && showCenter) {
                Object.values(allStations).forEach(st => {
                    if (st.is_reg_center && !listToProcess.includes(st)) listToProcess.push(st);
                });
            }

            listToProcess.forEach(st => {
                let radius, color, fillColor, weight, opacity, visible = false;
                
                // 1. 修改「區域中心站」 (Regional Center)
                if (st.is_reg_center) {
                    radius = 7;            // 圓圈大小
                    //color = '#ffffff';     // 外框顏色 (現在是白色)
                    color = '#f6e05e';     // 外框顏色 (現在是黃色)
                    fillColor = '#38a169'; // 圓心顏色 (綠色)
                    weight = 2.0;          // 外框粗細
                    opacity = 1;           // 透明度 (0~1)
                    if(showCenter) visible = true;
                    
                // 2. 修改「中繼站」 (Repeater / Hub)
                } else if (st.is_hub) {
                    radius = 4.5; color = '#fff'; fillColor = '#e53e3e'; weight = 1.5; opacity = 0.9;
                    if(showHub) visible = true;
                    
                // 3. 修改「自動站」 (Automatic Station)
                } else {
                    radius = 1.8; color = '#fff'; fillColor = '#4299e1'; weight = 0.5; opacity = 0.6;
                    if(showAuto) visible = true;
                }

                if (visible) {
                    const m = L.circleMarker([st.lat, st.lon], { radius, color, fillColor, fillOpacity: opacity, weight }).addTo(markerLayer);
                    m.bindPopup(`
                        <div style="min-width:280px;"><b style="font-size:15px; color:#2d3748;">${st.n}</b><hr style="border:0; border-top:1px solid #edf2f7; margin:8px 0;">
                        <table class="info-table"><tr><th>區域站</th><td>${st.reg}</td></tr><tr><th>站碼</th><td>${st.cwbid}</td></tr><tr><th>座標</th><td>${st.lat.toFixed(5)}, ${st.lon.toFixed(5)}</td></tr><tr><th>地址</th><td>${st.addr}</td></tr></table></div>
                    `);
                }

                if (showAutoHubLink && st.repid && allStations[st.repid]) {
                    L.polyline([[st.lat, st.lon], [allStations[st.repid].lat, allStations[st.repid].lon]], { color: '#e53e3e', weight: 1, opacity: 0.35, dashArray: '4,4' }).addTo(lineLayer);
                }
                if (showHubRegLink && st.is_hub && (!st.repid || !allStations[st.repid])) {
                    const center = regionalCenters[st.folder];
                    if (center) L.polyline([[st.lat, st.lon], [center.lat, center.lon]], { color: '#38a169', weight: 1.8, opacity: 0.5, dashArray: '8,8' }).addTo(lineLayer);
                }
            });
        }

        function focusMainCat(mKey) { const nodes = []; Object.values(treeData[mKey]).forEach(s => Object.values(s).forEach(f => f.forEach(n => nodes.push(...getAll(n))))); drawMap(nodes); if(nodes.length > 0) map.fitBounds(L.latLngBounds(nodes.map(s=>[s.lat, s.lon])), {padding:[50,50]}); }
        function focusGroupList(nodes) { const all = nodes.flatMap(n => getAll(n)); drawMap(all); if(all.length > 0) map.fitBounds(L.latLngBounds(all.map(s=>[s.lat, s.lon])), {padding:[40,40]}); }
        function focusGroup(n) { const g = getAll(n); drawMap(g); map.fitBounds(L.latLngBounds(g.map(s=>[s.lat, s.lon])), {padding:[40,40]}); }
        function getAll(node, list = []) { list.push(node); if(node.children) node.children.forEach(c => getAll(c, list)); return list; }
        function focusPoint(st) { map.setView([st.lat, st.lon], 14); markerLayer.eachLayer(m => { if(m.getLatLng && m.getLatLng().lat === st.lat) m.openPopup(); }); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); setTimeout(() => map.invalidateSize(), 350); }
        function collapseAll() { document.querySelectorAll('#treeView details').forEach(d => d.open = false); document.querySelectorAll('.st-item').forEach(el => el.classList.remove('active-highlight')); }
        function resetMap() { drawMap(); map.setView([23.7, 121.0], 8); }


        window.onload = loadDataAndInit;
    </script>
</body>
</html>
