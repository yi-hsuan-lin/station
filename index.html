                else if (st.sub_cat === '石門水庫') color = '#2b6cb0'; 
                else if (st.sub_cat === '翡翠水庫') color = '#38b2ac'; 
                else if (st.sub_cat === '第10河川局') color = '#b83280'; 
                else if (st.sub_cat === '農村水保署') color = '#975a16'; 
                else color = '#718096';
            } else if (st.main_cat === '高公局') { color = '#4a5568';
            } else if (st.main_cat === '西濱') { color = '#dd6b20'; 
            } else if (st.main_cat === '合作站') { color = '#f56565'; 
            } else if (st.main_cat === '環境部') { color = '#9ae6b4'; 
            } else if (st.main_cat === '民航局') { color = '#63b3ed'; }

            let path = '';
            if (st.main_cat === '署屬站') { 
                if (st.sub_cat === '農業站') {
                    // 農業站畫三角形
                    path = `<polygon points="${half},0 ${size},${size*0.866} 0,${size*0.866}" fill="${color}" stroke="#fff" stroke-width="1.5" />`;
                } else {
                    // 其他署屬站維持畫圓形
                    path = `<circle cx="${half}" cy="${half}" r="${size*0.4}" fill="${color}" stroke="${strokeColor}" stroke-width="1.5" />`;
                }
            } else if (st.main_cat === '外單位') { 
                let s = size * 0.75, offset = size * 0.125;
                path = `<rect x="${offset}" y="${offset}" width="${s}" height="${s}" fill="${color}" stroke="#fff" stroke-width="1.5" rx="2" />`;
            } else if (st.main_cat === '高公局' || st.main_cat === '西濱') { 
                path = `<polygon points="${half},0 ${size},${half} ${half},${size} 0,${half}" fill="${color}" stroke="#fff" stroke-width="1.5" />`;
            } else if (st.main_cat === '農業站') { 
                path = `<polygon points="${half},0 ${size},${size*0.866} 0,${size*0.866}" fill="${color}" stroke="#fff" stroke-width="1.5" />`;
            } else if (st.main_cat === '合作站') { 
                path = `<polygon points="0,0 ${size},0 ${half},${size*0.866}" fill="${color}" stroke="#fff" stroke-width="1.5" />`;
            } else if (st.main_cat === '環境部') { 
                let t = size/3, tt = size*2/3;
                path = `<polygon points="${t},0 ${tt},0 ${tt},${t} ${size},${t} ${size},${tt} ${tt},${tt} ${tt},${size} ${t},${size} ${t},${tt} 0,${tt} 0,${t} ${t},${t}" fill="${color}" stroke="#4a5568" stroke-width="1" />`;
            } else if (st.main_cat === '民航局') { 
                let s = size;
                path = `<polygon points="${s*0.5},0 ${s*0.61},${s*0.35} ${s},${s*0.35} ${s*0.68},${s*0.57} ${s*0.79},${s*0.91} ${s*0.5},${s*0.7} ${s*0.21},${s*0.91} ${s*0.32},${s*0.57} 0,${s*0.35} ${s*0.39},${s*0.35}" fill="${color}" stroke="#fff" stroke-width="1" />`;
            }
            
            if (path === '') { path = `<circle cx="${half}" cy="${half}" r="${size*0.4}" fill="#718096" stroke="#fff" stroke-width="1.5" />`; }

            let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${path}</svg>`;
            return L.divIcon({ html: svg, className: '', iconSize: [size, size], iconAnchor: [half, half], popupAnchor: [0, -half] });
        }

        function collapseAll() { document.querySelectorAll('#treeView details').forEach(d => d.open = false); document.querySelectorAll('.st-item').forEach(el => el.classList.remove('active-highlight')); }
        function resetMap() { 
            openPopupStation = null;
            map.closePopup();
            currentFilter = null; 
            drawMap(); 
            map.setView([23.7, 121.0], 8); 
        }

        function isInGroup(st) {
            if (!highlightedStation) return true;
            // 💡 修正 1：改用 sid 比對
            if (st === highlightedStation || st.sid === highlightedStation.sid) return true;
            const hSt = highlightedStation;
            
            if (hSt.is_reg_center) {
                if (st.is_hub) return st.folder === hSt.folder; 
                
                if (!st.is_reg_center && !st.is_hub) { 
                    if (st.repid && allStations[st.repid]) {
                        const hub = allStations[st.repid];
                        return hub && hub.folder === hSt.folder;
                    } else {
                        return st.folder === hSt.folder;
                    }
                }
                return false;
            }
            
            if (hSt.is_hub) {
                if (!st.is_reg_center && !st.is_hub && st.repid)
                    // 💡 修正 2：改用 sid 比對
                    return st.repid === hSt.sid;
                return false;
            }
            return false;
        }

        function toggleName(type) {
            const zoom = map ? map.getZoom() : 0;
            const isFocused = !!highlightedStation; 
            
            let autoOn = false;
            if (type === 'Center') autoOn = (zoom >= 7);
            else if (type === 'Hub') autoOn = (zoom >= 10);
            else if (type === 'Auto') autoOn = isFocused; 
            
            const cur = labelState[type];
            labelState[type] = (cur === null) ? (autoOn ? false : true) : null;
            drawMap(currentFilter);
        }


        // ================================================================
        // === 🆕 新增功能：連線距離、地形剖面、轄下清單匯出、網址聚焦 ===
        // ================================================================

        // 兩點大圓距離（公里）
        function haversineKm(lat1, lon1, lat2, lon2) {
            const R = 6371.0088, toR = Math.PI / 180;
            const dLat = (lat2 - lat1) * toR, dLon = (lon2 - lon1) * toR;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * toR) * Math.cos(lat2 * toR) * Math.sin(dLon / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(a));
        }

        // 每站的上層連線對象（規則與地圖連線完全相同）：有 repid → 該中繼站；否則 → 所屬區域中心
        function computeLinks() {
            const centerByFolder = {};
            Object.values(allStations).forEach(s => { if (s.is_reg_center && s.folder) centerByFolder[s.folder] = s; });
            Object.values(allStations).forEach(s => {
                s._link = null;
                if (s.is_reg_center || typeof s.lat !== 'number' || typeof s.lon !== 'number') return;
                let t = null, kind = null;
                if (s.repid && allStations[s.repid]) {
                    const p = allStations[s.repid];
                    t = { n: p.n, sid: p.sid, lat: p.lat, lon: p.lon, alt: p.alt };
                    kind = p.is_hub ? 'hub' : 'station';
                } else if (regionalCenters && s.folder && regionalCenters[s.folder]) {
                    const c = regionalCenters[s.folder], cs = centerByFolder[s.folder];
                    t = { n: cs ? cs.n : s.folder, sid: cs ? cs.sid : null, lat: c.lat, lon: c.lon, alt: cs ? cs.alt : undefined };
                    kind = 'center';
                }
                if (t && typeof t.lat === 'number' && typeof t.lon === 'number') {
                    s._link = { name: t.n, sid: t.sid, lat: t.lat, lon: t.lon, alt: t.alt, kind: kind, km: haversineKm(s.lat, s.lon, t.lat, t.lon) };
                }
            });
        }

        const LINK_KIND_LABEL = { hub: '中繼站', center: '區域中心', station: '上層站' };
        const hasAlt = v => v !== undefined && v !== null && v !== '' && isFinite(Number(v));

        // 資訊卡中的連線資訊列
        function linkInfoRows(st) {
            if (!st._link) return '';
            const L0 = st._link;
            let rows = `<tr><th>連線至</th><td>${esc(L0.name)}（${LINK_KIND_LABEL[L0.kind]}）</td></tr>
                        <tr><th>連線距離</th><td><b>${L0.km.toFixed(1)}</b> km</td></tr>`;
            if (hasAlt(st.alt) && hasAlt(L0.alt)) {
                const diff = Number(st.alt) - Number(L0.alt);
                rows += `<tr><th>海拔差</th><td>${diff >= 0 ? '高' : '低'} ${Math.abs(diff).toFixed(0)} m（本站 ${Number(st.alt).toFixed(0)} m／對方 ${Number(L0.alt).toFixed(0)} m）</td></tr>`;
            }
            return rows;
        }

        // 資訊卡下方的動作按鈕（用 data-act 事件代理，不把站碼塞進 onclick 字串）
        function popupActions(st) {
            const sid = esc(st.sid);
            let html = '<div class="popup-actions">';
            if (st._link) html += `<button data-act="profile" data-sid="${sid}">📈 地形剖面</button>`;
            if (st.is_hub || st.is_reg_center) html += `<button data-act="export" data-sid="${sid}">📥 匯出轄下測站</button>`;
            html += `<button data-act="link" data-sid="${sid}">🔗 複製連結</button></div>`;
            return html;
        }

        document.addEventListener('click', function (e) {
            const btn = e.target.closest('[data-act]');
            if (!btn) return;
            const sid = btn.getAttribute('data-sid');
            const act = btn.getAttribute('data-act');
            if (act === 'profile') showProfile(sid);
            else if (act === 'export') exportGroupCSV(sid);
            else if (act === 'link') copyStationLink(sid);
        });

        // --- 長距離連線標示 ---
        function isLongLink(st) {
            const t = document.getElementById('longLinkToggle');
            if (!t || !t.checked || !st._link) return false;
            const th = parseFloat(document.getElementById('longLinkKm').value);
            return st._link.km > (isFinite(th) && th > 0 ? th : 20);
        }
        const LONG_LINK_COLOR = '#dd6b20';
        function withLong(st, inG, style) {
            if (inG && isLongLink(st)) return Object.assign({}, style, { color: LONG_LINK_COLOR, opacity: 0.9, weight: 2.4 });
            return style;
        }

        // --- 底圖 ---
        const BASEMAP_KEY = 'stationRelation.basemap';
        const HILLSHADE_KEY = 'stationRelation.hillshade';
        function loadPref(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        function savePref(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 忽略 */ } }
        let baseLayers = {}, currentBase = null, hillshadeLayer = null;

        function initBasemaps() {
            baseLayers = {
                carto: L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_2osw_1_c7a0c0e05b43943486e746b0', { attribution: '© CartoDB', maxZoom: 19 }),
                shade: L.tileLayer('https://wmts.nlsc.gov.tw/wmts/MOI_SHADERMAP/default/EPSG:3857/{z}/{y}/{x}', { attribution: '© 內政部國土測繪中心', maxNativeZoom: 16, maxZoom: 19 }),
                topo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles © Esri', maxZoom: 19 })
            };
            hillshadeLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Hillshade © Esri', opacity: 0.5, maxNativeZoom: 16, maxZoom: 19, zIndex: 5, className: 'hillshade-layer'
            });
            const sel = document.getElementById('basemapSelect');
            const saved = loadPref(BASEMAP_KEY);
            if (saved && baseLayers[saved]) sel.value = saved;
            setBasemap(sel.value);
            sel.addEventListener('change', () => { setBasemap(sel.value); savePref(BASEMAP_KEY, sel.value); });

            const hs = document.getElementById('hillshadeToggle');
            hs.checked = loadPref(HILLSHADE_KEY) === '1';
            if (hs.checked) hillshadeLayer.addTo(map);
            hs.addEventListener('change', () => {
                if (hs.checked) hillshadeLayer.addTo(map); else map.removeLayer(hillshadeLayer);
                savePref(HILLSHADE_KEY, hs.checked ? '1' : '0');
            });
        }
        function setBasemap(key) {
            if (currentBase) map.removeLayer(currentBase);
            currentBase = baseLayers[key] || baseLayers.carto;
            currentBase.addTo(map);
            currentBase.bringToBack();
        }

        // --- 轄下測站匯出 CSV ---
        function isInGroupOf(hSt, st) {
            if (st === hSt || st.sid === hSt.sid) return true;
            if (hSt.is_reg_center) {
                if (st.is_hub) return st.folder === hSt.folder;
                if (!st.is_reg_center && !st.is_hub) {
                    if (st.repid && allStations[st.repid]) return allStations[st.repid].folder === hSt.folder;
                    return st.folder === hSt.folder;
                }
                return false;
            }
            if (hSt.is_hub) return !st.is_reg_center && !st.is_hub && st.repid === hSt.sid;
            return false;
        }

        function exportGroupCSV(sid) {
            const h = allStations[sid];
            if (!h) return;
            const members = Object.values(allStations)
                .filter(s => s !== h && isInGroupOf(h, s))
                .sort((a, b) => (b.is_hub ? 1 : 0) - (a.is_hub ? 1 : 0) || String(a.n || '').localeCompare(String(b.n || ''), 'zh-Hant'));
            if (members.length === 0) { showToast('此站沒有轄下測站'); return; }
            const headers = ['類型', '站名', '站碼(cwbid)', '無線電站碼(sid)', '所屬中繼站', '區域站', '緯度', '經度', '海拔(m)', '連線至', '連線距離(km)', '地址'];
            const rows = members.map(s => {
                const parent = (s.repid && allStations[s.repid]) ? allStations[s.repid].n : (s.is_hub ? '' : '（直連區域中心）');
                return [
                    s.is_hub ? '中繼站' : '自動站', s.n, s.cwbid || '', s.sid || '', parent, s.reg || '',
                    s.lat, s.lon, hasAlt(s.alt) ? s.alt : '',
                    s._link ? s._link.name : '', s._link ? s._link.km.toFixed(2) : '', s.addr || ''
                ].map(v => `"${String(v === undefined || v === null ? '' : v).replace(/"/g, '""')}"`).join(',');
            });
            const title = `"${(h.is_hub ? '中繼站：' : '區域中心：') + String(h.n).replace(/"/g, '""')}（轄下 ${members.length} 站）"`;
            const csv = '﻿' + [title, headers.join(','), ...rows].join('\n');
            const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
            const a = document.createElement('a');
            a.href = url;
            a.download = `轄下測站_${h.n}_${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // --- 網址記住聚焦狀態（?focus=站碼） ---
        function syncURL() {
            try {
                const url = new URL(window.location.href);
                if (highlightedStation && highlightedStation.sid) url.searchParams.set('focus', highlightedStation.sid);
                else url.searchParams.delete('focus');
                if (url.href !== window.location.href) history.replaceState(null, '', url.href);
            } catch (e) { /* 舊瀏覽器忽略 */ }
        }
        // 頁面一開始就先記下網址參數（地圖初始化時會同步網址，避免參數先被清掉）
        const URL_FOCUS_SID = (() => { try { return new URLSearchParams(window.location.search).get('focus'); } catch (e) { return null; } })();
        function focusFromURL() {
            try {
                const sid = URL_FOCUS_SID;
                if (sid && allStations[sid]) navigateToStation(sid);
                else if (sid) showToast(`找不到網址指定的測站：${sid}`);
            } catch (e) { /* 忽略 */ }
        }
        function copyStationLink(sid) {
            let href;
            try { const u = new URL(window.location.href); u.searchParams.set('focus', sid); href = u.href; }
            catch (e) { href = window.location.href.split('?')[0] + '?focus=' + encodeURIComponent(sid); }
            const done = () => showToast('已複製此站連結，貼給同事即可直接開到這一站');
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(href).then(done).catch(() => fallbackCopy(href, done));
            } else fallbackCopy(href, done);
        }
        function fallbackCopy(text, done) {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); done(); } catch (e) { prompt('請複製以下連結：', text); }
            ta.remove();
        }
        function showToast(msg) {
            let t = document.getElementById('toast');
            if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ================================================================
        // === 📈 地形剖面（AWS Terrain Tiles，Terrarium 編碼）===
        // ================================================================
        const DEM_TILE_URL = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
        const DEM_ZOOM = 12;              // 約 35 m/像素（臺灣緯度）
        const K_FACTOR = 4 / 3;           // 標準大氣折射的等效地球半徑係數
        const EARTH_R_KM = 6371;
        const demTileCache = new Map();
        let profileLayer = null, profileHoverMarker = null, currentProfile = null;

        function loadDemTile(z, x, y) {
            const key = `${z}/${x}/${y}`;
            if (!demTileCache.has(key)) {
                demTileCache.set(key, new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => {
                        try {
                            const c = document.createElement('canvas');
                            c.width = c.height = 256;
                            const ctx = c.getContext('2d');
                            ctx.drawImage(img, 0, 0);
                            resolve(ctx.getImageData(0, 0, 256, 256).data);
                        } catch (err) { demTileCache.delete(key); reject(err); }
                    };
                    img.onerror = () => { demTileCache.delete(key); reject(new Error('DEM tile load failed')); };
                    img.src = DEM_TILE_URL.replace('{z}', z).replace('{x}', x).replace('{y}', y);
                }));
            }
            return demTileCache.get(key);
        }

        async function getElevation(lat, lon) {
            const n = 2 ** DEM_ZOOM;
            const latR = lat * Math.PI / 180;
            const xf = (lon + 180) / 360 * n;
            const yf = (1 - Math.log(Math.tan(latR) + 1 / Math.cos(latR)) / Math.PI) / 2 * n;
            const x = Math.floor(xf), y = Math.floor(yf);
            const px = Math.min(255, Math.floor((xf - x) * 256)), py = Math.min(255, Math.floor((yf - y) * 256));
            const d = await loadDemTile(DEM_ZOOM, x, y);
            const i = (py * 256 + px) * 4;
            const e = d[i] * 256 + d[i + 1] + d[i + 2] / 256 - 32768;
            return Math.max(0, e);   // 海面以 0 m 計（瓦片在海上是海底深度）
        }

        async function showProfile(sid) {
            const st = allStations[sid];
            if (!st || !st._link) return;
            const A = { n: st.n, lat: st.lat, lon: st.lon, alt: st.alt };
            const B = { n: st._link.name, lat: st._link.lat, lon: st._link.lon, alt: st._link.alt, kind: st._link.kind };
            const D = st._link.km;

            const panel = document.getElementById('profilePanel');
            const ctl = document.querySelector('.map-controls');
            if (panel.style.display !== 'flex' && ctl) { panel._ctlWasOpen = ctl.open; ctl.open = false; }   // 避免面板蓋住圖層設定
            panel.style.display = 'flex';
            document.getElementById('profileTitle').textContent = `📈 地形剖面：${A.n} → ${B.n}（${LINK_KIND_LABEL[B.kind]}）`;
            document.getElementById('profileStats').textContent = '地形資料載入中…';
            document.getElementById('profileChart').innerHTML = '';
            map.closePopup();

            // 地圖上標出這條連線
            if (!profileLayer) profileLayer = L.layerGroup().addTo(map);
            profileLayer.clearLayers();
            L.polyline([[A.lat, A.lon], [B.lat, B.lon]], { color: '#2b6cb0', weight: 4, opacity: 0.9, interactive: false }).addTo(profileLayer);
            profileHoverMarker = L.circleMarker([A.lat, A.lon], { radius: 6, color: '#fff', weight: 2, fillColor: '#2b6cb0', fillOpacity: 1, interactive: false });
            map.fitBounds(L.latLngBounds([[A.lat, A.lon], [B.lat, B.lon]]), { paddingTopLeft: [40, 40], paddingBottomRight: [40, panel.offsetHeight + 40] });

            const N = Math.max(100, Math.min(500, Math.round(D * 1000 / 40)));
            const pts = [];
            for (let i = 0; i < N; i++) {
                const f = i / (N - 1);
                pts.push({ f: f, d: D * f, lat: A.lat + (B.lat - A.lat) * f, lon: A.lon + (B.lon - A.lon) * f });
            }
            const token = {};
            currentProfile = token;
            try {
                const elev = await Promise.all(pts.map(p => getElevation(p.lat, p.lon)));
                if (currentProfile !== token) return;   // 已開啟另一條剖面
                pts.forEach((p, i) => { p.e = elev[i]; });
                currentProfile = { A, B, D, pts };
                renderProfile();
            } catch (err) {
                console.warn(err);
                if (currentProfile !== token) return;
                document.getElementById('profileStats').textContent = '⚠️ 無法取得地形資料（需要能連到 s3.amazonaws.com），請稍後再試。';
            }
        }

        function computeProfile(P) {
            const antA = Math.max(0, parseFloat(document.getElementById('antennaA').value) || 0);
            const antB = Math.max(0, parseFloat(document.getElementById('antennaB').value) || 0);
            const hA = P.pts[0].e + antA, hB = P.pts[P.pts.length - 1].e + antB;
            let worst = null;
            P.pts.forEach((p, i) => {
                p.bulge = (p.d * (P.D - p.d)) / (2 * K_FACTOR * EARTH_R_KM) * 1000;   // 地球曲率（m）
                p.eff = p.e + p.bulge;
                p.los = hA + (hB - hA) * p.f;
                p.clear = p.los - p.eff;
                if (i > 0 && i < P.pts.length - 1 && (!worst || p.clear < worst.clear)) worst = p;
            });
            return { hA, hB, antA, antB, worst };
        }

        function niceStep(range, target) {
            const raw = range / target, mag = Math.pow(10, Math.floor(Math.log10(raw)));
            const n = raw / mag;
            return (n >= 5 ? 10 : n >= 2 ? 5 : n >= 1 ? 2 : 1) * mag;
        }

        function renderProfile() {
            const P = currentProfile;
            if (!P || !P.pts || P.pts[0].e === undefined) return;
            const R = computeProfile(P);
            const box = document.getElementById('profileChart');
            const W = Math.max(320, box.clientWidth), H = 230;
            const m = { l: 56, r: 18, t: 22, b: 32 };
            const iw = W - m.l - m.r, ih = H - m.t - m.b;
            const yMaxRaw = Math.max(...P.pts.map(p => Math.max(p.eff, p.los)));
            const yStep = niceStep(Math.max(50, yMaxRaw), 5);
            const yMax = Math.ceil((yMaxRaw * 1.08) / yStep) * yStep;
            const xs = d => m.l + d / P.D * iw;
            const ys = v => m.t + ih - (v / yMax) * ih;

            let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="地形剖面圖">`;
            // 格線與 Y 軸（淡色，不搶資料）
            for (let v = 0; v <= yMax + 1e-6; v += yStep) {
                s += `<line x1="${m.l}" x2="${W - m.r}" y1="${ys(v)}" y2="${ys(v)}" stroke="#edf2f7" stroke-width="1"/>`;
                s += `<text x="${m.l - 8}" y="${ys(v) + 4}" text-anchor="end" font-size="11" fill="#718096">${v.toLocaleString()}</text>`;
            }
            s += `<text x="12" y="${m.t + ih / 2}" font-size="11" fill="#718096" transform="rotate(-90 12 ${m.t + ih / 2})" text-anchor="middle">高度 (m)</text>`;
            const xStep = niceStep(P.D, 6);
            for (let d = 0; d <= P.D + 1e-6; d += xStep) {
                s += `<text x="${xs(d)}" y="${H - m.b + 18}" text-anchor="middle" font-size="11" fill="#718096">${+d.toFixed(1)}</text>`;
            }
            s += `<text x="${W - m.r}" y="${H - 4}" text-anchor="end" font-size="11" fill="#718096">距 ${esc(P.A.n)} (km)</text>`;
            // 地形（含地球曲率）面積
            const terrainPath = P.pts.map((p, i) => `${i ? 'L' : 'M'}${xs(p.d).toFixed(1)},${ys(p.eff).toFixed(1)}`).join(' ');
            s += `<path d="${terrainPath} L${xs(P.D)},${ys(0)} L${xs(0)},${ys(0)} Z" fill="#a0702a" fill-opacity="0.28" stroke="none"/>`;
            s += `<path d="${terrainPath}" fill="none" stroke="#a0702a" stroke-width="2" stroke-linejoin="round"/>`;
            // 遮蔽區段
            P.pts.forEach((p, i) => {
                if (i > 0 && i < P.pts.length - 1 && p.clear < 0) {
                    s += `<line x1="${xs(p.d)}" x2="${xs(p.d)}" y1="${ys(p.eff)}" y2="${ys(p.los)}" stroke="#c53030" stroke-width="2" stroke-opacity="0.55"/>`;
                }
            });
            // 視線
            s += `<line x1="${xs(0)}" y1="${ys(R.hA)}" x2="${xs(P.D)}" y2="${ys(R.hB)}" stroke="#2b6cb0" stroke-width="2"/>`;
            // 兩端點與直接標籤
            s += `<circle cx="${xs(0)}" cy="${ys(R.hA)}" r="5" fill="#2b6cb0" stroke="#fff" stroke-width="2"/>`;
            s += `<circle cx="${xs(P.D)}" cy="${ys(R.hB)}" r="5" fill="#2b6cb0" stroke="#fff" stroke-width="2"/>`;
            s += `<text x="${xs(0) + 8}" y="${ys(R.hA) - 8}" font-size="12" font-weight="700" fill="#2d3748">${esc(P.A.n)}</text>`;
            s += `<text x="${xs(P.D) - 8}" y="${ys(R.hB) - 8}" text-anchor="end" font-size="12" font-weight="700" fill="#2d3748">${esc(P.B.n)}</text>`;
            // 最差點
            if (R.worst) {
                const w = R.worst, blocked = w.clear < 0;
                s += `<circle cx="${xs(w.d)}" cy="${ys(w.eff)}" r="5" fill="${blocked ? '#c53030' : '#ffffff'}" stroke="${blocked ? '#ffffff' : '#a0702a'}" stroke-width="2"/>`;
                const lx = Math.min(Math.max(xs(w.d), m.l + 60), W - m.r - 60);
                s += `<text x="${lx}" y="${Math.max(m.t + 10, ys(Math.max(w.eff, w.los)) - 12)}" text-anchor="middle" font-size="11" font-weight="700" fill="#2d3748">${blocked ? '⚠ 遮蔽 +' + Math.round(-w.clear) + ' m' : '最小餘裕 ' + Math.round(w.clear) + ' m'}</text>`;
            }
            // 十字游標層
            s += `<line id="pfCross" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="#4a5568" stroke-width="1" stroke-dasharray="3,3" visibility="hidden"/>`;
            s += `<rect id="pfHit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" style="cursor:crosshair"/>`;
            s += `</svg>`;
            box.innerHTML = s + '<div id="pfTip" class="pf-tip"></div>';

            // 統計文字
            const w = R.worst;
            const altNote = (lbl, ground, alt) => `${lbl}地面 ${Math.round(ground)} m${hasAlt(alt) ? `（資料海拔 ${Math.round(alt)} m）` : ''}`;
            const verdict = !w ? '' : (w.clear < 0
                ? `⚠️ 地形遮蔽：距 ${P.A.n} ${w.d.toFixed(1)} km 處，地形高出視線 ${Math.round(-w.clear)} m`
                : `✅ 視線未被地形遮蔽，最小餘裕 ${Math.round(w.clear)} m（距 ${P.A.n} ${w.d.toFixed(1)} km 處）`);
            document.getElementById('profileStats').textContent =
                `距離 ${P.D.toFixed(1)} km ｜ ${altNote(P.A.n + ' ', P.pts[0].e, P.A.alt)} ｜ ${altNote(P.B.n + ' ', P.pts[P.pts.length - 1].e, P.B.alt)} ｜ ${verdict}`;
            document.getElementById('profileStats').className = 'pf-stats' + (w && w.clear < 0 ? ' blocked' : '');

            // 十字游標與地圖同步
            const hit = document.getElementById('pfHit'), cross = document.getElementById('pfCross'), tip = document.getElementById('pfTip');
            const svgEl = box.querySelector('svg');
            hit.addEventListener('pointermove', ev => {
                const r = svgEl.getBoundingClientRect();
                const x = ev.clientX - r.left;
                const f = Math.min(1, Math.max(0, (x - m.l) / iw));
                const p = P.pts[Math.round(f * (P.pts.length - 1))];
                cross.setAttribute('x1', xs(p.d)); cross.setAttribute('x2', xs(p.d)); cross.setAttribute('visibility', 'visible');
                tip.replaceChildren();
                const rowsData = [
                    [`${p.d.toFixed(2)} km`, `距 ${P.A.n}`],
                    [`${Math.round(p.e)} m`, '地形'],
                    [`${Math.round(p.los)} m`, '視線'],
                    [`${p.clear >= 0 ? '+' : ''}${Math.round(p.clear)} m`, p.clear < 0 ? '⚠ 遮蔽' : '餘裕（含地球曲率）']
                ];
                rowsData.forEach(([v, k]) => {
                    const row = document.createElement('div');
                    const b = document.createElement('b'); b.textContent = v;
                    const sp = document.createElement('span'); sp.textContent = ' ' + k;
                    row.append(b, sp); tip.appendChild(row);
                });
                tip.style.display = 'block';
                const tx = xs(p.d) + 12;
                tip.style.left = (tx + 170 > W ? xs(p.d) - 182 : tx) + 'px';
                tip.style.top = (m.t + 4) + 'px';
                if (profileHoverMarker) { profileHoverMarker.setLatLng([p.lat, p.lon]); if (!map.hasLayer(profileHoverMarker)) profileHoverMarker.addTo(profileLayer); }
            });
            hit.addEventListener('pointerleave', () => {
                cross.setAttribute('visibility', 'hidden');
                tip.style.display = 'none';
                if (profileHoverMarker) profileLayer.removeLayer(profileHoverMarker);
            });
        }

        function closeProfile() {
            const panel = document.getElementById('profilePanel');
            const ctl = document.querySelector('.map-controls');
            if (panel.style.display === 'flex' && ctl && panel._ctlWasOpen) ctl.open = true;
            panel.style.display = 'none';
            currentProfile = null;
            if (profileLayer) profileLayer.clearLayers();
        }

        function downloadProfileCSV() {
            const P = currentProfile;
            if (!P || !P.pts || P.pts[0].e === undefined) return;
            computeProfile(P);
            const head = ['距起點(km)', '緯度', '經度', '地形高度(m)', '地球曲率修正(m)', '視線高度(m)', '餘裕(m)'];
            const rows = P.pts.map(p => [p.d.toFixed(3), p.lat.toFixed(6), p.lon.toFixed(6), p.e.toFixed(1), p.bulge.toFixed(1), p.los.toFixed(1), p.clear.toFixed(1)].join(','));
            const url = URL.createObjectURL(new Blob(['﻿' + [`"${P.A.n} → ${P.B.n}"`, head.join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8;' }));
            const a = document.createElement('a');
            a.href = url; a.download = `地形剖面_${P.A.n}_${P.B.n}.csv`;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        ['antennaA', 'antennaB'].forEach(id => document.getElementById(id).addEventListener('input', renderProfile));
        window.addEventListener('resize', () => { if (currentProfile && document.getElementById('profilePanel').style.display !== 'none') renderProfile(); });


        window.onload = () => { loadDataAndInit(); lucide.createIcons(); };
    </script>
</body>
